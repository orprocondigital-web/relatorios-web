<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensagem Enviada | Orprocon Contabilidade</title>
    <style>
        :root {
            --primary-color: #0F2C59;
            --secondary-color: #3F72AF;
            --accent-color: #FF9F43;
            --light-bg: #F9F7F7;
            --dark-text: #1E2022;
            --muted-text: #686D76;
            --white: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--light-bg);
            color: var(--dark-text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: var(--white);
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(15, 44, 89, 0.1);
            padding: 50px 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
        }

        .check-icon {
            width: 72px;
            height: 72px;
            background: #e7f4ea;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }

        .check-icon svg {
            width: 36px;
            height: 36px;
        }

        h1 {
            color: var(--primary-color);
            font-size: 24px;
            margin-bottom: 14px;
        }

        p {
            color: var(--muted-text);
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn-voltar {
            display: inline-block;
            background-color: var(--accent-color);
            color: var(--white);
            padding: 13px 32px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            transition: background-color 0.3s;
        }

        .btn-voltar:hover {
            background-color: #e8890f;
        }

        .whatsapp-link {
            display: block;
            margin-top: 20px;
            color: var(--secondary-color);
            font-size: 14px;
            text-decoration: none;
        }

        .whatsapp-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="check-icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M20 6L9 17L4 12" stroke="#1e7d34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
        <h1>Obrigado, sua mensagem foi enviada com sucesso!!</h1>
        <p>Recebemos seu contato e um de nossos especialistas vai retornar em breve. Enviamos também uma confirmação para o seu e-mail.</p>
        <a href="index.html" class="btn-voltar">Voltar ao Site</a>
        <a href="https://wa.me/5548991781362" class="whatsapp-link" target="_blank">Ou fale agora pelo WhatsApp (48) 99178-1362</a>
    </div>
</body>
</html>
